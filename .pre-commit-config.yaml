# Pre-commit hooks for EVoyage. Install once with:
#   pre-commit install --install-hooks
#   pre-commit install --hook-type commit-msg
# Run everything with:
#   pre-commit run --all-files
minimum_pre_commit_version: "3.7.0"
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.osm\.pbf$
      - id: end-of-file-fixer
        exclude: \.osm\.pbf$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.(bat|cmd)$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .github/yamllint.yml]

  # Local hooks use the toolchain already required to build the project.
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        description: Format C++ sources with the repository .clang-format
        entry: clang-format --dry-run --Werror
        language: system
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx|ipp|tpp)$
        exclude: ^(build/|cmake-build-)

      - id: gofumpt
        name: gofumpt
        description: Format Go sources (install with `go install mvdan.cc/gofumpt@latest`)
        entry: gofumpt -l -w
        language: system
        files: \.go$
        exclude: ^vendor/

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        name: commitlint
        description: Enforce Conventional Commits (config in .commitlintrc.yml)
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional@19"

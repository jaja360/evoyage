name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # .clang-format uses `Standard: c++23`, which needs clang-format >= 23.
  CLANG_FORMAT_VERSION: "23.1.5"
  CLANG_TIDY_VERSION: "23.1.4"

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install clang-format
        run: python -m pip install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: Check formatting
        run: |
          clang-format --version
          mapfile -t files < <(
            git ls-files 'engine/include/*' 'engine/src/*' 'engine/tests/*' |
              grep -E '\.(c|cc|cpp|cxx|h|hh|hpp|hxx|ipp|tpp)$' || true
          )
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::no C++ sources found under engine/include/, engine/src/ or engine/tests/"
            exit 1
          fi
          echo "Checking ${#files[@]} file(s)"
          clang-format --dry-run --Werror "${files[@]}"

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-14
          python -m pip install "clang-tidy==${CLANG_TIDY_VERSION}"

      - name: Configure (compile_commands.json)
        run: cmake --preset debug -DCMAKE_CXX_COMPILER=g++-14

      - name: Run clang-tidy
        env:
          CLANG_TIDY_PRESET: debug
        run: ${GITHUB_WORKSPACE}/.github/scripts/run-clang-tidy.sh

  gofumpt:
    name: gofumpt
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          check-latest: true
          cache: true

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Check formatting
        run: |
          unformatted="$(gofumpt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::gofumpt found unformatted files:"
            echo "$unformatted"
            gofumpt -d .
            exit 1
          fi

  yamllint:
    name: yamllint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: python -m pip install --upgrade yamllint

      - name: Lint YAML
        run: |
          mapfile -t files < <(
            find .github -type f \( -name '*.yml' -o -name '*.yaml' \)
            find . -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \)
            find engine server -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \)
          )
          yamllint -c .github/yamllint.yml "${files[@]}"

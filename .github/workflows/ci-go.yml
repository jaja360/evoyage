name: CI — Go

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: server/go.mod
          check-latest: true
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          args: --timeout=5m
          working-directory: server

  test:
    name: test
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the coverage ratchet can read the base branch.
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: server/go.mod
          check-latest: true
          cache: true

      - name: Build
        run: go build ./...

      - name: Test with race detector and coverage
        run: |
          go test ./... -race -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -n 1

      - name: Read coverage floor
        id: floor
        run: echo "value=$(tr -d '[:space:]' < "${GITHUB_WORKSPACE}/.coverage-floor")" >> "$GITHUB_OUTPUT"

      - name: Enforce coverage floor
        env:
          COVERAGE_FLOOR: ${{ steps.floor.outputs.value }}
        run: ${GITHUB_WORKSPACE}/.github/scripts/check-coverage.sh coverage.out

      - name: Enforce coverage ratchet (floor may not drop)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          ${GITHUB_WORKSPACE}/.github/scripts/check-floor.sh
